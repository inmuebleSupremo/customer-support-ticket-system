spring:
  application:
    name: resolvedesk
  datasource:
    url: ${RESOLVEDESK_DB_URL}
    username: ${RESOLVEDESK_DB_USERNAME}
    password: ${RESOLVEDESK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
