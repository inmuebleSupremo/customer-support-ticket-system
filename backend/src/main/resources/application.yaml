spring:
  application:
    name: resolvedesk
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${RESOLVEDESK_DB_URL}
    username: ${RESOLVEDESK_DB_USERNAME}
    password: ${RESOLVEDESK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

resolvedesk:
  bootstrap-admin:
    email: ${RESOLVEDESK_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${RESOLVEDESK_BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${RESOLVEDESK_BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${RESOLVEDESK_BOOTSTRAP_ADMIN_LAST_NAME:}
