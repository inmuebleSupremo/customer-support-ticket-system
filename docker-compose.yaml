services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${RESOLVEDESK_MYSQL_DATABASE}
      MYSQL_USER: ${RESOLVEDESK_DB_USERNAME}
      MYSQL_PASSWORD: ${RESOLVEDESK_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${RESOLVEDESK_MYSQL_ROOT_PASSWORD}
    ports:
      - "${RESOLVEDESK_MYSQL_PORT:-3306}:3306"
    volumes:
      - resolvedesk-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      RESOLVEDESK_DB_URL: jdbc:mysql://mysql:3306/${RESOLVEDESK_MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RESOLVEDESK_DB_USERNAME: ${RESOLVEDESK_DB_USERNAME}
      RESOLVEDESK_DB_PASSWORD: ${RESOLVEDESK_DB_PASSWORD}
      RESOLVEDESK_BOOTSTRAP_ADMIN_EMAIL: ${RESOLVEDESK_BOOTSTRAP_ADMIN_EMAIL}
      RESOLVEDESK_BOOTSTRAP_ADMIN_PASSWORD: ${RESOLVEDESK_BOOTSTRAP_ADMIN_PASSWORD}
      RESOLVEDESK_BOOTSTRAP_ADMIN_FIRST_NAME: ${RESOLVEDESK_BOOTSTRAP_ADMIN_FIRST_NAME}
      RESOLVEDESK_BOOTSTRAP_ADMIN_LAST_NAME: ${RESOLVEDESK_BOOTSTRAP_ADMIN_LAST_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${RESOLVEDESK_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    ports:
      - "${RESOLVEDESK_FRONTEND_PORT:-5173}:80"

volumes:
  resolvedesk-mysql-data:
